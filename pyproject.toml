[project]
name = "jpbench"
version = "0.1.0"
description = "JP-Bench: Japanese government and business web tasks for browser agents"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "hypothesis>=6", "pytest-cov>=5"]

[project.scripts]
jpbench = "jpbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jpbench"]

[tool.setuptools.package-data]
jpbench = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
